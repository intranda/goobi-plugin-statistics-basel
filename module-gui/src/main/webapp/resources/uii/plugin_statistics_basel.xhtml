<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:util="http://goobi.io/util"
    xmlns:form="http://goobi.io/form"
    xmlns:section="http://goobi.io/section">

    <!-- Permission check -->
    <h:panelGroup
        rendered="#{!LoginForm.hasRole('Plugin_statistics_basel')}"
        styleClass="color-box bg-hot text-white d-flex flex-row p-3">
        <h:outputText
            styleClass="fw-bold"
            value="#{msgs.plugin_administration_missingPermission} Plugin_statistics_basel" />
    </h:panelGroup>

    <ui:fragment rendered="#{LoginForm.hasRole('Plugin_statistics_basel')}">
        <h:form
            id="form"
            onkeypress="submitOnEnter(event);">

            <!-- Filter -->
            <section:section type="primary">
                <section:header
                    icon="filter"
                    title="#{msgs.auswahl2}" />
                <section:body padding="false">

                    <form:field
                        label="#{msgs.step}"
                        required="true">
                        <h:selectOneMenu
                            id="stepname"
                            styleClass="form-select"
                            value="#{StatisticalQuestionBean.currentPlugin.selectedStepName}">
                            <f:selectItem itemLabel="#{msgs.bitteAuswaehlen}" itemValue="" />
                            <f:selectItems value="#{StatisticalQuestionBean.currentPlugin.stepnames}" />
                        </h:selectOneMenu>
                        <form:message target="stepname" />
                    </form:field>

                    <form:field label="#{msgs.zeitraum} #{msgs.from}">
                        <p:calendar
                            id="startDate"
                            value="#{StatisticalQuestionBean.currentPlugin.startDateDate}"
                            styleClass="ff-goobi"
                            yearRange="-100:+100">
                            <f:passThroughAttribute name="autocomplete" value="off" />
                        </p:calendar>
                    </form:field>

                    <form:field label="#{msgs.zeitraum} #{msgs.to}">
                        <p:calendar
                            id="endDate"
                            value="#{StatisticalQuestionBean.currentPlugin.endDateDate}"
                            styleClass="ff-goobi"
                            yearRange="-100:+100">
                            <f:passThroughAttribute name="autocomplete" value="off" />
                        </p:calendar>
                    </form:field>

                    <form:field
                        group="true"
                        label="#{msgs.typ}"
                        required="true">
                        <h:selectOneRadio
                            id="type"
                            value="#{StatisticalQuestionBean.currentPlugin.selectedType}"
                            styleClass="select-radio select-radio-horizontal">
                            <f:selectItems value="#{StatisticalQuestionBean.currentPlugin.possibleTypes}" />
                        </h:selectOneRadio>
                    </form:field>

                </section:body>
                <section:footer>
                    <h:commandLink
                        id="cancel"
                        styleClass="btn btn-blank"
                        immediate="true"
                        action="#{StatisticalQuestionBean.currentPlugin.resetStatistics}">
                        <h:outputText value="#{msgs.abbrechen}" />
                    </h:commandLink>
                    <button
                        class="btn btn-primary submitOnEnter"
                        jsf:id="myStatisticButton"
                        type="submit"
                        jsf:action="#{StatisticalQuestionBean.calculate}">
                        <h:outputText value="#{msgs.calculateStatistics}" />
                    </button>
                </section:footer>
            </section:section>

            <!-- Results -->
            <h:panelGroup styleClass="mt-3 d-block" rendered="#{StatisticalQuestionBean.currentPlugin.resultList != null}">
                <section:section type="neutral">
                    <section:header
                        icon="table"
                        title="#{msgs.ergebnisse}" />
                    <section:body padding="false">
                        <div class="gw-table">
                            <div class="gw-table__wrapper" style="overflow-x: auto;">
                                <p:dataTable
                                    id="resultTable"
                                    value="#{StatisticalQuestionBean.currentPlugin.tableRows}"
                                    var="row"
                                    styleClass="table table-hover table-bordered table-sm"
                                    rowStyleClass="#{row.separator ? 'stats-separator' : (row.bold ? 'fw-bold' : '')}"
                                    resizableColumns="false">

                                    <p:column headerText="#{StatisticalQuestionBean.currentPlugin.selectedType}">
                                        <ui:fragment rendered="#{row.bold}"><b><h:outputText value="#{row.groupLabel}" /></b></ui:fragment>
                                        <h:outputText value="#{row.groupLabel}" rendered="#{!row.bold}" />
                                    </p:column>

                                    <p:column headerText="#{msgs.projekte}">
                                        <ui:fragment rendered="#{row.bold}"><b><h:outputText value="#{row.projectLabel}" /></b></ui:fragment>
                                        <h:outputText value="#{row.projectLabel}" rendered="#{!row.bold}" />
                                    </p:column>

                                    <p:columns
                                        value="#{StatisticalQuestionBean.currentPlugin.tableColumns}"
                                        var="col"
                                        headerText="#{StatisticalQuestionBean.currentPlugin.columnHeaders[col]}">
                                        <ui:fragment rendered="#{row.bold}"><b><h:outputText value="#{row.cells[col]}" /></b></ui:fragment>
                                        <h:outputText value="#{row.cells[col]}" rendered="#{!row.bold}" />
                                    </p:columns>

                                </p:dataTable>
                            </div>
                        </div>
                    </section:body>
                </section:section>

                <div class="form-actions">
                    <button
                        class="btn btn-primary"
                        jsf:id="excelDownload"
                        type="submit"
                        jsf:action="#{StatisticalQuestionBean.currentPlugin.generateExcelDownload}">
                        <util:icon-text icon="file-spreadsheet" text="#{msgs.download_excel}" />
                    </button>
                </div>
            </h:panelGroup>

        </h:form>
    </ui:fragment>
</ui:composition>
