<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:intranda="http://xmlns.jcp.org/jsf/composite/composites"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:button="http://goobi.io/button"
    xmlns:section="http://goobi.io/section"
    xmlns:table="http://goobi.io/table">
    <script src="template/js/Chart.bundle.min.js" />
    <h:panelGroup
        rendered="#{!LoginForm.hasRole('Plugin_statistics_basel')}"
        styleClass="color-box bg-hot text-white d-flex flex-row p-3">
        <h:outputText
            styleClass="fw-bold"
            value="#{msgs.plugin_administration_missingPermission} Plugin_statistics_basel" />
    </h:panelGroup>

    <ui:fragment rendered="#{LoginForm.hasRole('Plugin_statistics_basel')}">
        <h:form
            id="form"
            styleClass="flow"
            onkeypress="submitOnEnter(event);">

            <div
                class="row"
                role="main">
                <div class="col-sm-12">
                    <section:section type="primary">
                        <section:header
                            icon="filter"
                            title="#{msgs.auswahl2}" />
                        <section:body>

                            <intranda:formInputDropDown
                                id="stepname"
                                name="stepname"
                                label="#{msgs.step}"
                                field="#{StatisticalQuestionBean.currentPlugin.selectedStepName}"
                                help="#{msgs.helpSchritt}"
                                selectItems="#{StatisticalQuestionBean.currentPlugin.stepnames}"
                                required="true" />

                            <!-- startdate -->
                            <intranda:formInputCalendar
                                id="startDate"
                                name="startdateName"
                                label="#{msgs.zeitraum} #{msgs.from}"
                                field="#{StatisticalQuestionBean.currentPlugin.startDateDate}"
                                help="#{msgs.helpStartdate}"
                                required="false" />
                            <!-- enddate -->
                            <intranda:formInputCalendar
                                id="endDate"
                                name="enddateName"
                                label="#{msgs.zeitraum} #{msgs.to}"
                                field="#{StatisticalQuestionBean.currentPlugin.endDateDate}"
                                help="#{msgs.helpEnddate}"
                                required="false" />


                            <intranda:formInputRadio
                                id="type"
                                name="type"
                                label="#{msgs.typ}"
                                field="#{StatisticalQuestionBean.currentPlugin.selectedType}"
                                required="true">
                                <f:selectItems value="#{StatisticalQuestionBean.currentPlugin.possibleTypes}" />
                            </intranda:formInputRadio>

                        </section:body>
                        <section:footer>
                            <div class="d-flex justify-content-between align-items-center w-100">
                                <h:commandButton
                                    class="btn btn-secondary"
                                    id="excelDownload"
                                    type="submit"
                                    title="#{msgs.download_excel}"
                                    action="#{StatisticalQuestionBean.currentPlugin.generateExcelDownload}"
                                    rendered="#{StatisticalQuestionBean.currentPlugin.resultList != null}"
                                    value="#{msgs.download_excel}"/>
                                <div class="ms-auto">
                                    <button:row>
                                        <h:commandButton
                                            styleClass="btn btn-blank"
                                            id="cancel"
                                            title="#{msgs.abbrechen}"
                                            action="#{StatisticalQuestionBean.currentPlugin.resetStatistics}"
                                            value="#{msgs.abbrechen}">
                                        </h:commandButton>
                                        <h:commandButton
                                            styleClass="btn btn-primary submitOnEnter"
                                            id="myStatisticButton"
                                            type="submit"
                                            title="#{msgs.calculateStatistics}"
                                            action="#{StatisticalQuestionBean.calculate}"
                                            value="#{msgs.calculateStatistics}">
                                        </h:commandButton>
                                    </button:row>
                                </div>
                            </div>
                        </section:footer>
                    </section:section>
                </div>
            </div>

            <!-- ###################### result table ###################### -->
            <h:panelGroup rendered="#{StatisticalQuestionBean.currentPlugin.resultList != null}">
                <div class="row">
                    <div class="col-sm-12">
                        <section:section type="outline">
                            <section:header
                                icon="table"
                                title="#{msgs.ergebnisse}" />
                            <section:body>
                                <div style="overflow-x: auto;">
                                <p:dataTable
                                    id="resultTable"
                                    value="#{StatisticalQuestionBean.currentPlugin.tableRows}"
                                    var="row"
                                    styleClass="table table-bordered table-sm"
                                    style="width: auto;"
                                    rowStyleClass="#{row.separator ? 'stats-separator' : (row.bold ? 'fw-bold' : '')}"
                                    resizableColumns="false">

                                    <p:column headerText="#{StatisticalQuestionBean.currentPlugin.selectedType}">
                                        <ui:fragment rendered="#{row.bold}"><b><h:outputText value="#{row.groupLabel}" /></b></ui:fragment>
                                        <h:outputText value="#{row.groupLabel}" rendered="#{!row.bold}" />
                                    </p:column>

                                    <p:column headerText="#{msgs.projekte}">
                                        <ui:fragment rendered="#{row.bold}"><b><h:outputText value="#{row.projectLabel}" /></b></ui:fragment>
                                        <h:outputText value="#{row.projectLabel}" rendered="#{!row.bold}" />
                                    </p:column>

                                    <p:columns
                                        value="#{StatisticalQuestionBean.currentPlugin.tableColumns}"
                                        var="col"
                                        headerText="#{StatisticalQuestionBean.currentPlugin.columnHeaders[col]}">
                                        <ui:fragment rendered="#{row.bold}"><b><h:outputText value="#{row.cells[col]}" /></b></ui:fragment>
                                        <h:outputText value="#{row.cells[col]}" rendered="#{!row.bold}" />
                                    </p:columns>

                                </p:dataTable>
                                </div>
                            </section:body>
                        </section:section>
                    </div>
                </div>
            </h:panelGroup>
