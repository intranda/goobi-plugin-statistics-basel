<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:util="http://goobi.io/util"
    xmlns:form="http://goobi.io/form"
    xmlns:section="http://goobi.io/section">

    <!-- Permission check -->
    <h:panelGroup
        rendered="#{!LoginForm.hasRole('Plugin_statistics_basel')}"
        styleClass="color-box bg-hot text-white d-flex flex-row p-3">
        <h:outputText
            styleClass="fw-bold"
            value="#{msgs.plugin_administration_missingPermission} Plugin_statistics_basel" />
    </h:panelGroup>

    <ui:fragment rendered="#{LoginForm.hasRole('Plugin_statistics_basel')}">
        <h:form
            id="form"
            onkeypress="submitOnEnter(event);">

            <!-- Filter -->
            <section:section type="primary">
                <section:header
                    icon="filter"
                    title="#{msgs.auswahl2}" />
                <section:body padding="false">

                    <form:field
                        label="#{msgs.step}"
                        required="true">
                        <h:selectOneMenu
                            id="stepname"
                            styleClass="form-select"
                            value="#{StatisticalQuestionBean.currentPlugin.selectedStepName}">
                            <f:selectItem itemLabel="#{msgs.bitteAuswaehlen}" itemValue="" />
                            <f:selectItems value="#{StatisticalQuestionBean.currentPlugin.stepnames}" />
                        </h:selectOneMenu>
                        <form:message target="stepname" />
                    </form:field>

                    <form:field label="#{msgs.zeitraum} #{msgs.from}">
                        <p:calendar
                            id="startDate"
                            value="#{StatisticalQuestionBean.currentPlugin.startDateDate}"
                            styleClass="ff-goobi"
                            yearRange="-100:+100">
                            <f:passThroughAttribute name="autocomplete" value="off" />
                        </p:calendar>
                    </form:field>

                    <form:field label="#{msgs.zeitraum} #{msgs.to}">
                        <p:calendar
                            id="endDate"
                            value="#{StatisticalQuestionBean.currentPlugin.endDateDate}"
                            styleClass="ff-goobi"
                            yearRange="-100:+100">
                            <f:passThroughAttribute name="autocomplete" value="off" />
                        </p:calendar>
                    </form:field>

                    <form:field
                        group="true"
                        label="#{msgs.typ}"
                        required="true">
                        <h:selectOneRadio
                            id="type"
                            value="#{StatisticalQuestionBean.currentPlugin.selectedType}"
                            styleClass="select-radio select-radio-horizontal">
                            <f:selectItems value="#{StatisticalQuestionBean.currentPlugin.possibleTypes}" />
                        </h:selectOneRadio>
                    </form:field>

                </section:body>
                <section:footer>
                    <h:commandLink
                        id="cancel"
                        styleClass="btn btn-blank"
                        immediate="true"
                        action="#{StatisticalQuestionBean.currentPlugin.resetStatistics}">
                        <h:outputText value="#{msgs.abbrechen}" />
                    </h:commandLink>
                    <button
                        class="btn btn-primary submitOnEnter"
                        jsf:id="myStatisticButton"
                        type="submit"
                        jsf:action="#{StatisticalQuestionBean.calculate}">
                        <h:outputText value="#{msgs.calculateStatistics}" />
                    </button>
                </section:footer>
            </section:section>

            <!-- Results -->
            <h:panelGroup styleClass="mt-3 d-block" rendered="#{StatisticalQuestionBean.currentPlugin.resultList != null}">
                <ui:repeat
                    var="group"
                    value="#{StatisticalQuestionBean.currentPlugin.resultList}">
                    <div class="box box--neutral box--no-padding mb-3">
                        <div class="box__content">
                            <div class="box__title">
                                <h2><util:icon icon="table" /><h:outputText value="#{group.name}" /></h2>
                            </div>
                            <div class="box__body">
                                <div class="gw-table">
                                    <div class="gw-table__search ps-3">
                                        <div class="gw-table__search__length">
                                            <h:outputText value="#{msgs.treffer}: #{group.values.size()}" />
                                        </div>
                                        <div class="gw-table__filters">
                                            <span class="me-3">
                                                <h:outputText value="#{msgs.pages}: #{group.totalPages}" />
                                            </span>
                                            <span class="me-3">
                                                <h:outputText value="#{msgs.aktuelleProzesse}: #{group.totalProcesses}" />
                                            </span>
                                        </div>
                                    </div>
                                    <div class="gw-table__wrapper">
                                        <h:dataTable
                                            styleClass="table table-hover table-bordered"
                                            columnClasses=",,text-end,text-end,text-end"
                                            headerClass="text-nowrap"
                                            var="item"
                                            value="#{group.values}">
                                            <h:column>
                                                <f:facet name="header">
                                                    <h:outputText value="#{msgs.projekt}" />
                                                </f:facet>
                                                <h:outputText value="#{item.projektTitle}" />
                                            </h:column>
                                            <h:column>
                                                <f:facet name="header">
                                                    <h:outputText value="#{msgs.zeitraum}" />
                                                </f:facet>
                                                <h:outputText value="#{item.date}" />
                                            </h:column>
                                            <h:column headerClass="text-end">
                                                <f:facet name="header">
                                                    <h:outputText value="#{msgs.pages}" />
                                                </f:facet>
                                                <h:outputText value="#{item.pages}" />
                                            </h:column>
                                            <h:column headerClass="text-end">
                                                <f:facet name="header">
                                                    <h:outputText value="#{msgs.part}" />
                                                </f:facet>
                                                <h:outputText value="#{item.percent}">
                                                    <f:convertNumber type="percent" maxFractionDigits="1" />
                                                </h:outputText>
                                            </h:column>
                                            <h:column headerClass="text-end">
                                                <f:facet name="header">
                                                    <h:outputText value="#{msgs.aktuelleProzesse}" />
                                                </f:facet>
                                                <h:outputText value="#{item.processes}" />
                                            </h:column>
                                        </h:dataTable>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </ui:repeat>
                <div class="form-actions">
                    <button
                        class="btn btn-primary"
                        jsf:id="excelDownload"
                        type="submit"
                        jsf:action="#{StatisticalQuestionBean.currentPlugin.generateExcelDownload}">
                        <util:icon-text icon="file-spreadsheet" text="#{msgs.download_excel}" />
                    </button>
                </div>
            </h:panelGroup>

        </h:form>
    </ui:fragment>
</ui:composition>
