<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:intranda="http://xmlns.jcp.org/jsf/composite/composites"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:button="http://goobi.io/button"
    xmlns:section="http://goobi.io/section"
    xmlns:table="http://goobi.io/table">
	<script src="template/js/Chart.bundle.min.js"/>
	<h:panelGroup
		rendered="#{!LoginForm.hasRole('Plugin_statistics_kick_start')}"
		styleClass="color-box bg-hot text-white d-flex flex-row p-3">
		<h:outputText
			styleClass="fw-bold"
			value="#{msgs.plugin_administration_missingPermission} Plugin_statistics_kick_start" />
	</h:panelGroup>
	
	<ui:fragment rendered="#{LoginForm.hasRole('Plugin_statistics_kick_start')}">
		<h:form id="form" styleClass="flow" onkeypress="submitOnEnter(event);">

			<div class="row" role="main">
				<div class="col-sm-12">
					<section:section type="primary">
						<section:header
							icon="filter"
							title="#{msgs.auswahl2}" />
						<section:body>
							<!-- Filter -->
							<intranda:formInputText
								id="filter"
								name="filter"
								label="#{msgs.filter}"
								field="#{StatisticalQuestionBean.currentPlugin.filter}"
								help="#{msgs.helpFilter}"
								fieldStyle="form-control"
								required="false"  />
							<!-- startdate -->
							<intranda:formInputCalendar
								id="startDate"
								name="startdateName"
								label="#{msgs.zeitraum} #{msgs.from}"
								field="#{StatisticalQuestionBean.currentPlugin.startDateDate}"
								help="#{msgs.helpStartdate}"
								required="false" />
							<!-- enddate -->
							<intranda:formInputCalendar
								id="endDate"
								name="enddateName"
								label="#{msgs.zeitraum} #{msgs.to}"
								field="#{StatisticalQuestionBean.currentPlugin.endDateDate}"
								help="#{msgs.helpEnddate}"
								required="false" />
						</section:body>
						<section:footer>
							<!-- Generate the statistics or cancel again -->
							<button:row>
								<h:commandButton
									styleClass="btn btn-blank"
									id="cancel"
									title="#{msgs.abbrechen}"
									action="#{StatisticalQuestionBean.currentPlugin.resetStatistics}"
									value="#{msgs.abbrechen}">
								</h:commandButton>
								<h:commandButton
									styleClass="btn btn-primary submitOnEnter"
									id="myStatisticButton"
									type="submit"
									title="#{msgs.calculateStatistics}"
									action="#{StatisticalQuestionBean.calculate}"
									value="#{msgs.calculateStatistics}">
								</h:commandButton>
							</button:row>
						</section:footer>
					</section:section>
				</div>
			</div>

			<!-- ###################### result table ###################### -->
			<h:panelGroup rendered="#{StatisticalQuestionBean.currentPlugin.resultList != null}">
				<div class="row">
					<div class="col-sm-12">
						<section:section type="outline">
							<section:header
								icon="table"
								title="#{msgs.ergebnisse}" />
							<section:body>
								<table:wrapper>
									<table:search>
										<table:hits>
											<h:outputText value="#{msgs.treffer}: #{StatisticalQuestionBean.currentPlugin.resultList.size()}" />
										</table:hits>
									</table:search>
									<h:dataTable
										id="results"
										styleClass="table table-hover table-nomargin dataTable table-bordered responsive"
										var="item"
										value="#{StatisticalQuestionBean.currentPlugin.resultList}">
										<h:column>
											<f:facet name="header">
												<h:outputText value="#{msgs.ID}" />
											</f:facet>
											<h:outputText value="#{item.PROZESSEID}" />
										</h:column>
										<h:column>
											<f:facet name="header">
												<h:outputText value="#{msgs.title}" />
											</f:facet>
											<h:outputText value="#{item.TITEL}" />
										</h:column>
										<h:column>
											<f:facet name="header">
												<h:outputText value="#{msgs.images}" />
											</f:facet>
											<h:outputText value="#{item.SORTHELPERIMAGES}" />
										</h:column>
										<h:column>
											<f:facet name="header">
												<h:outputText value="#{msgs.docstructs}" />
											</f:facet>
											<h:outputText value="#{item.SORTHELPERDOCSTRUCTS}" />
										</h:column>
										<h:column>
											<f:facet name="header">
												<h:outputText value="#{msgs.metadata}" />
											</f:facet>
											<h:outputText value="#{item.SORTHELPERMETADATA}" />
										</h:column>
									</h:dataTable>
								</table:wrapper>
							</section:body>
							<section:footer>
								<button:row>
									<h:commandButton
										styleClass="btn btn-primary"
										id="excelDownload"
										type="submit"
										title="#{msgs.download_excel}"
										action="#{StatisticalQuestionBean.currentPlugin.generateExcelDownload}"
										value="#{msgs.download_excel}">
								</h:commandButton>
								</button:row>
							</section:footer>
						</section:section>
					</div>
				</div>
			</h:panelGroup>
			<!-- ###################### // result table ###################### -->

			<!-- ###################### Bar chart ###################### -->
			<h:panelGroup rendered="#{StatisticalQuestionBean.currentPlugin.resultList != null}">
				<div class="row">
					<div class="col-sm-12">
						<section:section type="outline">
							<section:header
								icon="chart-pie"
								title="#{msgs.ergebnisse}" />
							<section:body padding="true">
								<canvas id="myChart" width="400px" height="#{StatisticalQuestionBean.currentPlugin.resultList.size() * 100}"/>
								<script type="text/javascript">
									let ctx = document.getElementById("myChart").getContext('2d');
									let myChart = new Chart(ctx, {
										type: 'horizontalBar',
										data: {
											labels: [#{StatisticalQuestionBean.currentPlugin.chartLabels}],
											datasets: [
												{
													label: "#{msgs.images}",
													data: [#{StatisticalQuestionBean.currentPlugin.chartValuesImages}],
													backgroundColor: "#EC9A29",
												},
												{
													label: "#{msgs.docstructs}",
													data: [#{StatisticalQuestionBean.currentPlugin.chartValuesDocstructs}],
													backgroundColor: "#A8201A",
												},
												{
													label: "#{msgs.metadata}",
													data: [#{StatisticalQuestionBean.currentPlugin.chartValuesMetadata}],
													backgroundColor: "#7D80DA",
												}]
										},
										options: {
												legend: {
												display: true,
												position: 'bottom',
											},
											responsive: true,
											maintainAspectRatio: false,
										}
									});
								</script>
							</section:body>
						</section:section>
					</div>
				</div>
			</h:panelGroup>
			<!-- ###################### // Bar chart ###################### -->

			<!-- ###################### Doughnut chart ###################### -->
			<h:panelGroup rendered="#{StatisticalQuestionBean.currentPlugin.resultList != null}">
				<div class="row">
					<div class="col-sm-12">
						<section:section type="outline">
							<section:header
								icon="chart-pie"
								title="#{msgs.ergebnisse}" />
							<section:body padding="true">
								<canvas id="myChart2" width="400px" height="400px"/>
								<script type="text/javascript">
									let ctx = document.getElementById("myChart2").getContext('2d');
									let myChart = new Chart(ctx, {
										type: 'doughnut',
										data: {
											labels: [#{StatisticalQuestionBean.currentPlugin.chartLabels}],
											datasets: [
												{
													label: "#{msgs.images}",
													data: [#{StatisticalQuestionBean.currentPlugin.chartValuesImages}],
													backgroundColor: ['#143642', '#0F8B8D', '#EC9A29', '#A8201A', '#C8963E', '#D1462F', '#7D80DA', '#E9D758']
												}]
										},
										options: {
												legend: {
												display: true,
												position: 'bottom'
											},
											responsive: true,
											maintainAspectRatio: false
										}
									});
								</script>
							</section:body>
						</section:section>
					</div>
				</div>
			</h:panelGroup>
			<!-- ###################### // Doughnut chart ###################### -->
		</h:form>
	</ui:fragment>
</ui:composition>
